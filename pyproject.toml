[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "executor-service"
version = "0.1.0"
description = "Durable Redis-stream worker for executing AI-generated code on Jupyter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "jupyter-client>=8.6,<9",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "redis>=6.2,<7",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.35,<1",
    "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["executor"]

